
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Synced Shapes Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Load Miro Web SDK v2 -->
  <script src="https://miro.com/app/static/sdk/v2/miro.jsstyle>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 12px;
      background: #fff;
    }
    h1 { font-size: 16px; margin-bottom: 12px; }
    button {
      display: block;
      width: 100%;
      margin-bottom: 8px;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #d0d4e4;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
    }
    button.primary { background: #4262ff; color: #fff; border: none; }
    #log {
      margin-top: 12px;
      font-size: 11px;
      color: #555;
      white-space: pre-wrap;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <h1>Synced Shapes</h1>

  <button id="set-master" class="primary">Set selected shape as master</button>
  <button id="create-copy">Create synced copy</button>
  <button id="sync-copies">Sync copies from master</button>
  <button id="close-panel">Close panel</button>

  <div id="log"></div>

  <!-- IMPORTANT: reuse the same logic you have in script.js -->
  <!-- Relative path (no leading slash) so GitHub Pages resolves correctly -->
  <script src="script.js<!-- Panel-only wiring: bind buttons to the functions exposed by script.js -->
  <script>
    miro.onReady(() => {
      // Ensure the headless script has attached the functions
      const api = window.syncedShapes || {};
      const warn = (msg) => {
        const el = document.getElementById('log');
        if (el) el.textContent = msg;
        console.warn('[Synced Shapes]', msg);
      };

      if (!api.setSelectedAsMaster || !api.createSyncedCopy || !api.syncCopiesFromMaster) {
        warn('Core functions not found. Make sure script.js loads correctly.');
        return;
      }

      document.getElementById('set-master')?.addEventListener('click', api.setSelectedAsMaster);
      document.getElementById('create-copy')?.addEventListener('click', api.createSyncedCopy);
      document.getElementById('sync-copies')?.addEventListener('click', api.syncCopiesFromMaster);

      document.getElementById('close-panel')?.addEventListener('click', async () => {
        await miro.board.ui.closePanel('closed');
      });
    });
  </script>
</body>
</html>
