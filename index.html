
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Synced Shapes</title>

  <!-- Load the Miro Web SDK v2 -->
  <script src="https://miro.com/app/static/sdk/v2/mi>

  <!-- Your panel styles and app logic -->
  panel.css
  index.js</script>
</head>
<body>
  <!-- Panel UI template; injected by index.js when Miro opens it -->
  <template id="panel">
    <div class="panel">
      <h2>Synced Shapes</h2>

      <fieldset>
        <legend>Sync properties</legend>
        <label><input type="checkbox" id="sync-text" checked disabled /> Text (always on)</label><br />
        <label><input type="checkbox" id="sync-color" checked /> Color (fill + text color)</label><br />
        <label><input type="checkbox" id="sync-font" checked /> Font (family + size)</label>
      </fieldset>

      <div class="buttons">
        <button id="mark-master">Mark selected as Master</button>
        <button id="duplicate-link">Duplicate & Link</button>
        <button id="sync">Sync from Master</button>
      </div>

      <p id="status"></p>
    </div>
  </template>
</body>
</html>
